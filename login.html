<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — RescueFleet</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="login">

<div class="auth-page">
    <!-- Top Bar -->
    <div class="auth-topbar">
        <div class="auth-topbar-actions">
            <button onclick="toggleDark()" title="Toggle Dark Mode"><i class="fa-solid fa-moon"></i></button>
            <button onclick="toggleRTL()" title="Toggle RTL"><i class="fa-solid fa-right-left"></i></button>
        </div>
    </div>

    <!-- Orbs -->
    <div class="auth-card-orb orb-1"></div>
    <div class="auth-card-orb orb-2"></div>

    <!-- Card -->
    <div class="auth-card">
        <div class="auth-card-logo"><a href="index.html" id="authCardLogo"></a></div>

        <h1>Welcome Back</h1>
        <p class="auth-subtitle">Sign in to access your roadside assistance dashboard</p>

        <!-- Social Login -->
        <div class="social-login-grid">
            <button class="social-btn" id="googleBtn"><span>Google</span></button>
            <button class="social-btn" id="appleBtn"><span>Apple</span></button>
            <button class="social-btn" id="facebookBtn"><span>Facebook</span></button>
        </div>

        <div class="divider">or sign in with email</div>

        <!-- Form -->
        <form onsubmit="return false;">
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input class="form-input" type="email" id="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div class="password-wrapper">
                    <input class="form-input" type="password" id="password" placeholder="Enter your password" required>
                    <button type="button" class="password-toggle" onclick="togglePasswordVisibility('password', this)">
                        <i class="fa-regular fa-eye pw-icon"></i>
                    </button>
                </div>
            </div>

            <div class="form-row">
                <label class="checkbox-wrapper">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" class="link-primary">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In
            </button>
        </form>

        <p class="auth-footer">Don't have an account? <a href="signup.html">Create Account</a></p>
    </div>
</div>

<script src="components.js"></script>
</body>
</html>
